[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "archspec",
]

[project]
name = "aarch64-variant-provider"
description = "A wheel variant provider with properties specific to AArch64 CPUs"
authors = [{name = "Michał Górny", email = "mgorny@quansight.com"}]
license = "MIT"
license-files = [
    "LICENSE",
    "aarch64_variant_provider/vendor/archspec/COPYRIGHT",
    "aarch64_variant_provider/vendor/archspec/LICENSE-*",
    "aarch64_variant_provider/vendor/archspec/NOTICE",
    "aarch64_variant_provider/vendor/archspec/archspec/vendor/cpuid/LICENSE",
]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = []

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
]

[project.urls]
Home = "https://github.com/wheelnext/aarch64-variant-provider/"

[project.entry-points.variant_plugins]
aarch64 = "aarch64_variant_provider"

[tool.hatch.version]
path = "aarch64_variant_provider/__init__.py"

[tool.hatch.build.targets.wheel]
include = [
    "aarch64_variant_provider/*.py",
    "aarch64_variant_provider/vendor/*.py",
    "aarch64_variant_provider/vendor/archspec/archspec/*.py",
    "aarch64_variant_provider/vendor/archspec/archspec/cpu/*.py",
    "aarch64_variant_provider/vendor/archspec/archspec/json/cpu",
    "aarch64_variant_provider/vendor/archspec/archspec/vendor/cpuid/cpuid.py",
]
